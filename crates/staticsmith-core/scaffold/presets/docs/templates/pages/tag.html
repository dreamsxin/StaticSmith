{% extends "layouts/base.html" %}

{% block main %}
<h1 class="section-title">标签：{{ term.name }}</h1>
<p class="section-intro">共 {{ term.count }} 篇</p>

<ul class="archive">
  {% for item in items %}
    <li>
      {% if item.date %}<time datetime="{{ item.date }}">{{ item.date | date(format="%Y-%m-%d") }}</time>{% endif %}
      <a href="{{ item.url | safe }}">{{ item.title }}</a>
    </li>
  {% endfor %}
</ul>

{% include "components/pagination.html" %}
{% endblock %}
