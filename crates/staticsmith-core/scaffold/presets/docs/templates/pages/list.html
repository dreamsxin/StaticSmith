{% extends "layouts/base.html" %}

{% block main %}
<h1 class="section-title">{{ page.title }}</h1>
<div class="section-intro">{{ page.content | safe }}</div>

<ul class="archive">
  {% for item in items %}
    <li>
      {% if item.date %}<time datetime="{{ item.date }}">{{ item.date | date(format="%Y-%m-%d") }}</time>{% endif %}
      <a href="{{ item.url | safe }}">{{ item.title }}</a>
    </li>
  {% endfor %}
</ul>

{% include "components/pagination.html" %}
{% endblock %}
