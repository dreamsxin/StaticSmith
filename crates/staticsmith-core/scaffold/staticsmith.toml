[site]
title = "我的 Rust 静态站"
description = "基于 Tauri 的可视化工具"
base_url = "https://example.com"
language = "zh-CN"

[build]
output_dir = "./dist"
content_dir = "./content"
theme_dir = "./themes/default"
# 统一模板目录
template_dir = "./templates"
# 站点静态资源目录，整体复制到输出目录根部
static_dir = "./static"
page_size = 10
# 构建时是否压缩 HTML
minify = true

[assets]
# 编辑器插入的图片存放位置，相对 static_dir
dir = "images"
# 文件命名：sha256（默认）/ md5 / original
naming = "sha256"
# 哈希截断长度（8..=64）
hash_length = 16
# 用哈希前两位做二级目录，避免单目录堆积上万文件
shard = true
# 单文件大小上限（MB），0 表示不限制
max_size_mb = 32
# URL 前缀留空时按 dir 推导，此处等价于 "/images/"
# url_prefix = "https://cdn.example.com/images"

[taxonomy]
# 由 front matter 的 tags 生成 /tags/ 与 /tags/<标签>/
enabled = true
slug = "tags"
title = "标签"
list_template = "pages/tags.html"
term_template = "pages/tag.html"

# 需要「分类」等更多维度时改用 [[taxonomies]]，写了它上面的 [taxonomy] 就不再生效。
# name 是 front matter 字段名，slug 是 URL 前缀，模板可以复用同一套。
# [[taxonomies]]
# name = "tags"
# slug = "tags"
# title = "标签"
# list_template = "pages/tags.html"
# term_template = "pages/tag.html"
#
# [[taxonomies]]
# name = "categories"
# slug = "categories"
# title = "分类"
# list_template = "pages/tags.html"
# term_template = "pages/tag.html"


[deploy]
# 可选值：none / git / ftp
type = "none"

# [deploy.git]
# remote = "https://github.com/user/repo.git"
# branch = "main"
# commit_message = "站点更新于 {{ now() }}"
# auth_type = "token"   # token 或 ssh

