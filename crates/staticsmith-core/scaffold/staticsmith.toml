[site]
title = "我的 Rust 静态站"
description = "基于 Tauri 的可视化工具"
base_url = "https://example.com"
language = "zh-CN"

[build]
output_dir = "./dist"
content_dir = "./content"
theme_dir = "./themes/default"
# 统一模板目录
template_dir = "./templates"
# 站点静态资源目录，整体复制到输出目录根部
static_dir = "./static"
page_size = 10
# 构建时是否压缩 HTML
minify = true
# 未来日期的文章是否立刻发布。改成 false 就是定时发布：
# date 晚于构建时刻的文章先不进产物，配合定时构建到点上线。
publish_future = true


[assets]
# 编辑器插入的图片存放位置，相对 static_dir
dir = "images"
# 文件命名：sha256（默认）/ md5 / original
naming = "sha256"
# 哈希截断长度（8..=64）
hash_length = 16
# 用哈希前两位做二级目录，避免单目录堆积上万文件
shard = true
# 单文件大小上限（MB），0 表示不限制
max_size_mb = 32
# URL 前缀留空时按 dir 推导，此处等价于 "/images/"
# url_prefix = "https://cdn.example.com/images"

[taxonomy]
# 由 front matter 的 tags 生成 /tags/ 与 /tags/<标签>/
enabled = true
slug = "tags"
title = "标签"
list_template = "pages/tags.html"
term_template = "pages/tag.html"

# 需要「分类」等更多维度时改用 [[taxonomies]]，写了它上面的 [taxonomy] 就不再生效。
# name 是 front matter 字段名，slug 是 URL 前缀，模板可以复用同一套。
# [[taxonomies]]
# name = "tags"
# slug = "tags"
# title = "标签"
# list_template = "pages/tags.html"
# term_template = "pages/tag.html"
#
# [[taxonomies]]
# name = "categories"
# slug = "categories"
# title = "分类"
# list_template = "pages/tags.html"
# term_template = "pages/tag.html"


# 导航菜单。模板遍历 menu 渲染，所以加栏目改这里就够了，不用动 header.html。
# weight 小的在前，都不写就按书写顺序；blank = true 表示新窗口打开（站外链接常用）。
# 分类维度（标签等）由模板自己按 taxonomies 列出，不必在这里重复登记。
# 整段删掉也不会出错：菜单为空时脚手架模板退回内置的那几个链接。
[[menu]]
name = "首页"
url = "/"
weight = 1

[[menu]]
name = "文章"
url = "/posts/"
weight = 2

[[menu]]
name = "关于"
url = "/about/"
weight = 3


[deploy]
# 可选值：none / git / ftp
type = "none"

# [deploy.git]
# remote = "https://github.com/user/repo.git"
# branch = "main"
# commit_message = "站点更新于 {{ now() }}"
# auth_type = "token"   # token 或 ssh

