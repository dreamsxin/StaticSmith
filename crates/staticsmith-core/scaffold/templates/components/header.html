{# 全局头部组件：修改后所有继承 layouts/base.html 的页面都会被标记为待重新生成 #}
<header class="site-header">
  <a class="site-header__logo" href="/">{{ site.title }}</a>
  <nav class="site-header__nav">
    <a href="/">首页</a>
    <a href="/posts/">文章</a>
    {# taxonomies 是配置里生效的全部分类维度（标签、分类…），加一个维度不用改这里 #}
    {% for tax in taxonomies %}<a href="/{{ tax.slug }}/">{{ tax.title }}</a>{% endfor %}

    <a href="/about/">关于</a>
  </nav>
</header>
