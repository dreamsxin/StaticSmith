{% extends "layouts/base.html" %}

{% block main %}
<h1 class="section-title">{{ page.title }}</h1>

<ul class="tag-cloud">
  {% for term in terms %}
    <li>
      <a href="{{ term.url | safe }}">{{ term.name }}</a>
      <span class="tag-cloud__count">{{ term.count }}</span>
    </li>
  {% else %}
    <p class="empty">还没有任何标签。在文章 front matter 里写 <code>tags = ["标签"]</code> 即可。</p>
  {% endfor %}
</ul>
{% endblock %}
