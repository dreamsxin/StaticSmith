[package]
name = "staticsmith-core"
description = "StaticSmith 静态生成核心：配置、内容解析、模板依赖图、增量构建"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["serve", "history"]
# 本地预览 HTTP 服务器。CLI 与桌面端都需要它；纯构建场景可以关掉以减少依赖。
serve = ["dep:tiny_http"]
# 本地内容快照（影子 git 仓库）。破坏性操作前留一份可回退的版本。
# CI 里只做构建校验的场景可以关掉。
history = ["dep:git2"]


[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true

base64.workspace = true
tera.workspace = true
rusqlite.workspace = true
rayon.workspace = true
walkdir.workspace = true
pulldown-cmark.workspace = true
chrono.workspace = true
sha2.workspace = true
md-5.workspace = true
regex.workspace = true
notify.workspace = true
tracing.workspace = true
slug.workspace = true
zip.workspace = true
tiny_http = { workspace = true, optional = true }
# 只用来读写项目内的影子仓库，不发网络请求，所以不开任何传输后端。
# staticsmith-deploy 会把 https 打开，Cargo 特性合并后是同一份 libgit2。
git2 = { version = "0.19", optional = true, default-features = false }


[dev-dependencies]
tempfile.workspace = true
