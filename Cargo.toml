[workspace]
resolver = "2"
members = ["crates/staticsmith-core", "crates/staticsmith-cli", "crates/staticsmith-deploy", "crates/staticsmith-mcp", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/dreamsxin/StaticSmith"
authors = ["dreamszhu <dreamsxin@qq.com>"]

[workspace.dependencies]
staticsmith-core = { path = "crates/staticsmith-core" }
staticsmith-deploy = { path = "crates/staticsmith-deploy" }
staticsmith-mcp = { path = "crates/staticsmith-mcp" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# 属性面板要就地改 front matter：toml_edit 保序、保注释，toml 的 Value 往返会把它们抹掉
toml_edit = "0.22"

tera = "1.20"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
pulldown-cmark = "0.12"
gray_matter = "0.2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
regex = "1.11"
notify = "6.1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
slug = "0.1"
base64 = "0.22"
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
