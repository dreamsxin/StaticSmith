[workspace]
resolver = "2"
members = ["crates/staticsmith-core", "crates/staticsmith-cli", "crates/staticsmith-deploy", "crates/staticsmith-mcp", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/dreamsxin/StaticSmith"
authors = ["dreamszhu <dreamsxin@qq.com>"]

[workspace.dependencies]
staticsmith-core = { path = "crates/staticsmith-core" }
staticsmith-deploy = { path = "crates/staticsmith-deploy" }
staticsmith-mcp = { path = "crates/staticsmith-mcp" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# 属性面板要就地改 front matter：toml_edit 保序、保注释，toml 的 Value 往返会把它们抹掉
toml_edit = "0.22"

tera = "1.20"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
pulldown-cmark = "0.12"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
regex = "1.11"
notify = "6.1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
slug = "0.1"
base64 = "0.22"
# 主题包是 zip：只开 deflate，不引 aes / bzip2 / zstd——多一个压缩后端就多一份攻击面
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.12"
# 构建性能一直只有「设计目标」没有实测数字，`benches/build.rs` 把它变成可复现的测量。
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# 刻意不设 panic = "abort"。
#
# abort 能省下展开表、二进制小一点，但代价是任何一处 panic 都让窗口当场消失、
# 未保存的编辑一起丢。留着 unwind，IPC 命令边界（`AppState::with_session*`）
# 就能把 panic 兜成一条错误信息：进程活着，内容还在磁盘上。

