[package]
name = "staticsmith-app"
description = "StaticSmith 桌面端（Tauri 外壳 + IPC 命令层）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# Tauri 2 的移动端支持要求 lib 目标；桌面端 main.rs 也从这里入口。
name = "staticsmith_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
staticsmith-core.workspace = true
staticsmith-deploy.workspace = true
# MCP 服务端内嵌进桌面端：AI 接入不该只能从终端开（见 docs/mcp.md）
staticsmith-mcp.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 凭证写入操作系统凭据管理器（Windows Credential Manager / macOS Keychain / Secret Service）
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile.workspace = true
